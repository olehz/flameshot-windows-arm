name: Windows ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  FLAMESHOT_REF: v14.0.0
  QT_VERSION: 6.9.3
  # Same vcpkg pin as flameshot-org/flameshot Windows packaging.
  VCPKG_VERSION: d5ec528843d29e3a52d745a64b469f810b2cedbf
  VCPKG_TRIPLET: arm64-windows

jobs:
  portable:
    name: portable winarm64
    runs-on: windows-11-arm
    timeout-minutes: 180
    steps:
      - name: Checkout Flameshot
        uses: actions/checkout@v6
        with:
          repository: flameshot-org/flameshot
          ref: ${{ env.FLAMESHOT_REF }}
          path: flameshot
          fetch-depth: 0

      - name: Fix Python path
        shell: pwsh
        run: |
          Remove-Item "$env:LOCALAPPDATA\Microsoft\WindowsApps\python*.exe" -Force -ErrorAction SilentlyContinue

      - name: Read version
        shell: bash
        working-directory: flameshot
        run: |
          version=$(sed -n 's/^set(FLAMESHOT_VERSION \(.*\))/\1/p' CMakeLists.txt)
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "Building Flameshot ${version} (${FLAMESHOT_REF})"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows_arm64
          target: desktop
          arch: win64_msvc2022_arm64
          modules: qtimageformats
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-winarm64
          dir: ${{ github.workspace }}/qt

      - name: Setup MSVC ARM64
        shell: pwsh
        run: |
          function Find-VcVarsAll {
            Get-ChildItem -Path @(
              'C:\Program Files\Microsoft Visual Studio',
              'C:\Program Files (x86)\Microsoft Visual Studio'
            ) -Filter 'vcvarsall.bat' -Recurse -Depth 6 -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          $bat = Find-VcVarsAll
          if (-not $bat) {
            Write-Host 'vcvarsall.bat is not installed; adding the ARM64 C++ toolset'
            Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Depth 2 -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName }
            $setup = Get-ChildItem -Path 'C:\Program Files*\Microsoft Visual Studio\Installer\setup.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $setup) { throw 'Visual Studio installer was not found' }
            $installPath = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
            $verb = if (Test-Path $installPath) { 'modify' } else { 'install' }
            Write-Host "$verb $installPath"
            $proc = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList @(
              $verb,
              '--installPath', $installPath,
              '--add', 'Microsoft.VisualStudio.Workload.VCTools',
              '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64',
              '--add', 'Microsoft.VisualStudio.Component.Windows11SDK.22621',
              '--includeRecommended',
              '--quiet', '--wait', '--norestart'
            )
            Write-Host "Visual Studio installer exited $($proc.ExitCode)"
            if ($proc.ExitCode -notin 0, 3010) { throw "Visual Studio installer failed: $($proc.ExitCode)" }
            $bat = Find-VcVarsAll
            if (-not $bat) { throw 'vcvarsall.bat is still missing' }
          }
          Write-Host "using $bat"
          $lines = cmd /c "`"$bat`" arm64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvarsall arm64 exited $LASTEXITCODE" }
          $keep = @(
            'PATH','INCLUDE','LIB','LIBPATH',
            'VCINSTALLDIR','VCToolsInstallDir','VSINSTALLDIR',
            'WindowsSdkDir','WindowsSDKVersion','UniversalCRTSdkDir','UCRTVersion',
            'VSCMD_ARG_HOST_ARCH','VSCMD_ARG_TGT_ARCH'
          )
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$' -and $keep -contains $Matches[1]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
            }
          }
          Write-Host "exported MSVC environment for later steps"

      - name: Checkout vcpkg
        shell: pwsh
        run: |
          where.exe cl
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout $env:VCPKG_VERSION

      - name: Cache OpenSSL
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: vcpkg/installed
          key: openssl-${{ env.VCPKG_VERSION }}-${{ env.VCPKG_TRIPLET }}

      - name: Install OpenSSL
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cmd /c "vcpkg\bootstrap-vcpkg.bat -disableMetrics"
          .\vcpkg\vcpkg.exe install "openssl:${env:VCPKG_TRIPLET}"

      - name: Configure
        shell: pwsh
        working-directory: flameshot
        env:
          OPENSSL_ROOT_DIR: ${{ github.workspace }}\vcpkg\installed\arm64-windows
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=arm64-windows `
            -DENABLE_OPENSSL=ON `
            -DUSE_PORTABLE_CONFIG=ON

      - name: Compile
        shell: pwsh
        working-directory: flameshot
        run: cmake --build build

      - name: Check the executable is ARM64
        shell: pwsh
        working-directory: flameshot
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter flameshot.exe |
            Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "flameshot.exe was not produced" }
          $fs = [System.IO.File]::OpenRead($exe.FullName)
          $br = New-Object System.IO.BinaryReader($fs)
          $fs.Position = 0x3C
          $pe = $br.ReadInt32()
          $fs.Position = $pe + 4
          $machine = $br.ReadUInt16()
          $br.Close()
          $fs.Close()
          Write-Host "$($exe.FullName) PE machine 0x$($machine.ToString('X4'))"
          if ($machine -ne 0xAA64) {
            throw "expected ARM64 (0xAA64)"
          }

      - name: Package portable zip
        shell: pwsh
        working-directory: flameshot/build
        run: |
          cpack -G ZIP -B "$env:GITHUB_WORKSPACE\package"
          $src = Get-Item "$env:GITHUB_WORKSPACE\package\flameshot-*-win64.zip"
          $dst = Join-Path $env:GITHUB_WORKSPACE "flameshot-$env:VERSION-winarm64.zip"
          Copy-Item $src.FullName $dst
          Get-FileHash $dst -Algorithm SHA256 | Format-List

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: flameshot-${{ env.VERSION }}-winarm64
          path: flameshot-${{ env.VERSION }}-winarm64.zip
          if-no-files-found: error
          compression-level: 0
